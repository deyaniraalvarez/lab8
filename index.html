<!DOCTYPE html>
<html>
<head>
    <title>Estilos</title>
    <style>
        h1{
            color: rgb(20, 20, 199);
            font-size: 25px;
        }
        p{
            color: rgb(42, 122, 42);
            font-family: arial, Arial, Helvetica, sans-serif;
        }
        img{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!--aplicar estilos en linea-->
    <h1>Titulo en linea</h1>
    <p>parrafo en linea</p>
    <img src="imagen.png">
     <h1>Titulo en linea para ver  el estilo de h1</h1>
     <p>parrafo en linea  para ver el estilo de p</p>
</body>


</html>
